<style>
  :root {
    --primary: #1F3A5F; --secondary: #4A6A8A; --bg: #F7F8FA; --surface: #FFFFFF;
    --text: #1C1C1C; --success: #2E7D32; --warning: #B26A00; --danger: #C62828;
    --border: #D9DEE5; --kelabu-muda: #EEF1F5; --fokus: #4A6A8A;
    --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans', system-ui, Arial, sans-serif; font-size: 14px; line-height: 1.5;
    color: var(--text); background: var(--bg); overflow-x: hidden;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0; line-height: 1.3; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 var(--s2); line-height: 1.3; }
  h3 { font-size: 16px; font-weight: 600; margin: 0 0 var(--s2); }
  p { margin: 0 0 var(--s2); }
  a { color: var(--primary); }
  img, canvas, iframe { max-width: 100%; }
  :focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .caption, .bantuan { font-size: 12px; color: var(--secondary); }
  .tebal { font-weight: 600; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: var(--s3); }

  /* ---------- rangka ---------- */
  .topbar { background: var(--primary); color: #fff; }
  .topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2); padding-top: 12px; padding-bottom: 12px; }
  .brand { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: var(--s2); }
  .user { font-size: 12px; text-align: right; overflow-wrap: anywhere; }
  .user .emel { color: #C9D4E3; }
  .lencana-uji { background: #FFE9B8; color: #5A3600; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  nav.menu { background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.menu .wrap { display: flex; flex-wrap: wrap; gap: var(--s1); padding-top: var(--s1); padding-bottom: 0; }
  nav.menu a { padding: 10px var(--s3); color: var(--secondary); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; }
  nav.menu a:hover { color: var(--primary); }
  nav.menu a.aktif { color: var(--primary); border-bottom-color: var(--primary); }
  main#paparan:focus { outline: none; }
  main#paparan h1:focus { outline: none; }

  /* ---------- kad, tajuk ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: var(--s4); margin-bottom: var(--s3); }
  .card h3 { margin-top: var(--s3); }
  .card > h2:first-child, .card > h3:first-child { margin-top: 0; }
  .tajuk-baris { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); margin-bottom: var(--s3); }
  .tajuk-baris .tindakan { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .sub-tajuk { color: var(--secondary); margin-top: var(--s1); overflow-wrap: anywhere; }

  /* ---------- butang ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 40px; padding: 8px var(--s3);
    font: inherit; font-weight: 600; border-radius: 6px; border: 1px solid transparent; cursor: pointer; text-decoration: none; line-height: 1.2;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #172C48; }
  .btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--primary); }
  .btn-secondary:hover { background: var(--kelabu-muda); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn:disabled, .btn[aria-disabled="true"] { background: #E3E6EA; color: #6B7580; border-color: #E3E6EA; cursor: not-allowed; }
  .btn-kecil { min-height: 32px; padding: 4px 12px; font-size: 13px; }

  /* ---------- borang ---------- */
  label { display: block; font-weight: 600; margin-bottom: var(--s1); }
  .wajib { color: var(--danger); }
  input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
    width: 100%; min-height: 40px; padding: 8px 12px; font: inherit; color: var(--text); background: #fff;
    border: 1px solid #A9B3BF; border-radius: 6px;
  }
  textarea { resize: vertical; min-height: 96px; }
  input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--danger); }
  .ralat { color: var(--danger); font-size: 13px; margin-top: var(--s1); min-height: 0; }
  .ralat:empty { display: none; }
  .grid-borang { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3) var(--s4); }
  .grid-borang .lebar { grid-column: 1 / -1; }
  .bar-butang { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); }
  .cari-borang { display: flex; gap: var(--s2); }
  .cari-borang .medan-cari { flex: 1 1 auto; min-width: 0; }
  .pilihan-baris { display: flex; align-items: flex-start; gap: var(--s2); font-weight: 400; margin: 0 0 var(--s2); }
  .pilihan-baris input { margin-top: 3px; flex: none; }

  /* ---------- banner, status ---------- */
  .banner { border-radius: 6px; padding: 12px var(--s3); margin-bottom: var(--s3); border: 1px solid; }
  .banner.ralat-b { background: #FDECEC; border-color: var(--danger); color: #7A1313; }
  .banner.amaran-b { background: #FFF4E0; border-color: var(--warning); color: #5A3600; }
  .banner.maklumat-b { background: #EAF1F9; border-color: var(--secondary); color: #1F3A5F; }
  .banner.ok-b { background: #E8F5E9; border-color: var(--success); color: #1B5E20; }
  .banner ul { margin: var(--s1) 0 0; padding-left: 20px; }
  .kosong { text-align: center; padding: 40px var(--s3); color: var(--secondary); }
  .kosong p { margin-bottom: var(--s3); }
  .memuat { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 32px var(--s3); color: var(--secondary); }
  .putar { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--primary); animation: putar .8s linear infinite; flex: none; }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .putar { animation-duration: 3s; } }
  .status { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9AA5B1; flex: none; }
  .dot.ok { background: var(--success); }
  .dot.gagal { background: var(--danger); }

  /* ---------- lencana ---------- */
  .lencana { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .lencana.hijau { background: #DDEFDD; color: #1B5E20; }
  .lencana.merah { background: #F9DCDC; color: #8E1B1B; }
  .lencana.kelabu { background: #E3E6EA; color: #3B4652; }

  /* ---------- jadual ---------- */
  table.data { width: 100%; border-collapse: collapse; background: var(--surface); }
  table.data th { position: sticky; top: 0; text-align: left; background: var(--kelabu-muda); padding: 10px 12px; border-bottom: 2px solid var(--border); font-weight: 600; white-space: nowrap; }
  table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: break-word; }
  table.data tbody tr:nth-child(even) { background: #FAFBFC; }
  table.data tbody tr.baris-klik { cursor: pointer; }
  table.data tbody tr.baris-klik:hover { background: #EDF2F8; }
  table.data td.nombor, table.data th.nombor { text-align: right; font-variant-numeric: tabular-nums; }
  .jadual-bungkus { border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; background: var(--surface); }
  @media (min-width: 640px) { table.data td.nowrap, table.data th.nowrap { white-space: nowrap; } }
  .halaman { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s3); }
  .ringkasan-hasil { margin: var(--s3) 0 var(--s2); color: var(--secondary); }

  /* ---------- profil ---------- */
  dl.kv { display: grid; grid-template-columns: minmax(130px, 220px) minmax(0, 1fr); gap: 10px var(--s3); margin: 0; }
  dl.kv dt { color: var(--secondary); font-weight: 600; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  dl.kv dd.teks-panjang { white-space: pre-wrap; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s3); }
  .grid-2 > .card { margin-bottom: 0; }

  /* ---------- dashboard ---------- */
  .jubin { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin-bottom: var(--s3); }
  .jubin .kad { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: var(--s3); }
  .jubin.sempit { grid-template-columns: repeat(auto-fill, minmax(160px, 220px)); }
  .jubin .angka { font-size: 28px; font-weight: 600; color: var(--primary); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .jubin .angka.merah { color: var(--danger); }
  .jubin .angka.hijau { color: var(--success); }
  .carta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
  .carta-grid .card { margin-bottom: 0; min-width: 0; }
  .carta-kotak { position: relative; width: 100%; }
  details.angka-jadual { margin-top: var(--s2); }
  details.angka-jadual summary { cursor: pointer; color: var(--secondary); font-weight: 600; padding: var(--s1) 0; }
  .bar-css { display: grid; grid-template-columns: minmax(80px, 38%) minmax(0, 1fr) auto; gap: 4px var(--s2); align-items: center; }
  .bar-css .bar { height: 14px; background: var(--primary); border-radius: 2px; min-width: 2px; }

  /* ---------- import ---------- */
  .peta-jadual td, .peta-jadual th { padding: 6px 12px; }
  .peta-jadual select { min-height: 36px; }
  .kecil-input { min-height: 36px !important; }
  .teks-kod { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

  /* ---------- OPR ---------- */
  .pdf-bingkai { width: 100%; height: 640px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }

  /* ---------- toast, modal ---------- */
  #toasts { position: fixed; right: var(--s3); bottom: var(--s3); display: flex; flex-direction: column; gap: var(--s2); z-index: 60; max-width: calc(100vw - 32px); }
  .toast { background: #263238; color: #fff; padding: 12px var(--s3); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.25); max-width: 360px; overflow-wrap: anywhere; }
  .toast.ok { background: var(--success); }
  .toast.ralat-t { background: var(--danger); }
  .modal-latar { position: fixed; inset: 0; background: rgba(20, 30, 45, .55); display: flex; align-items: center; justify-content: center; padding: var(--s3); z-index: 80; }
  .modal { background: #fff; border-radius: 8px; padding: var(--s4); max-width: 460px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .modal-butang { display: flex; justify-content: flex-end; gap: var(--s2); margin-top: var(--s3); flex-wrap: wrap; }
  #sekat { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: var(--s3); }

  /* ---------- halaman penuh (akses ditolak, mesej) ---------- */
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--s3); }
  .center .card { max-width: 480px; width: 100%; margin: 0; }
  .denied h1 { color: var(--danger); margin-bottom: var(--s2); }
  code { background: var(--bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }

  /* ---------- tablet ---------- */
  @media (max-width: 1024px) {
    .carta-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- mobile: jadual jadi kad, tiada skrol mendatar ---------- */
  @media (max-width: 639px) {
    h1 { font-size: 20px; }
    .wrap { padding: 12px; }
    .card { padding: var(--s3); }
    .user { text-align: left; }
    nav.menu a { padding: 10px 12px; }
    .grid-borang, .grid-2 { grid-template-columns: minmax(0, 1fr); }
    dl.kv { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
    dl.kv dd { margin-bottom: var(--s2); }
    .cari-borang { flex-direction: column; }
    .pdf-bingkai { display: none; }
    .jadual-bungkus { border: 0; background: transparent; }
    table.data thead { position: absolute; left: -9999px; top: auto; }
    table.data, table.data tbody, table.data tr, table.data td { display: block; width: 100%; }
    table.data tr { background: var(--surface) !important; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; padding: 8px 12px; }
    table.data td { display: flex; gap: var(--s2); padding: 4px 0; border: 0; text-align: left; overflow-wrap: anywhere; }
    table.data td::before { content: attr(data-label); flex: 0 0 38%; color: var(--secondary); font-size: 12px; font-weight: 600; padding-top: 2px; }
    table.data td.nombor { text-align: left; }
    .bar-css { grid-template-columns: minmax(70px, 40%) minmax(0, 1fr) auto; }
    #toasts { left: var(--s3); }
    .toast { max-width: none; }
  }
</style>
